<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vĩnh Khánh — Danh sách quán</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent:  #f5a623;
    --accent2: #e85d24;
    --teal:    #1db87a;
    --bg:      #0e0e10;
    --surface: #18181c;
    --surface2:#222228;
    --border:  #2e2e38;
    --text:    #e8e4d8;
    --text2:   #9a9690;
    --text3:   #5a5854;
  }

  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: 0 0 40px;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-icon { font-size: 24px; }
  .header-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .header-sub { font-size: 11px; color: var(--text3); }

  /* ── DANH SÁCH ── */
  .container {
    max-width: 500px;
    margin: 20px auto;
    padding: 0 16px;
  }

  .list-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    padding-left: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .poi-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    transition: all .2s;
  }
  .poi-item:active { transform: scale(.97); background: var(--surface2); }

  .poi-img {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--surface2);
    flex-shrink: 0;
  }
  .poi-img-placeholder {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .poi-info { flex: 1; }
  .poi-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .poi-addr { font-size: 12px; color: var(--text3); line-height: 1.4; }
  
  .poi-arrow { color: var(--text3); font-size: 18px; }

  /* ── LOADING ── */
  .loading {
    text-align: center;
    margin-top: 60px;
  }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    margin-top: 40px;
    font-size: 11px;
    color: var(--text3);
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🍜</div>
  <div>
    <div class="header-title">Vĩnh Khánh</div>
    <div class="header-sub">Phố ẩm thực — Quận 4</div>
  </div>
</div>

<div class="container">
  <div class="list-title">📍 Khám phá quán ngon</div>

  <div id="poi-list">
    <div class="loading">
      <div class="spinner"></div>
      <div style="color: var(--text3); font-size: 13px;">Đang tìm các quán gần đây...</div>
    </div>
  </div>

  <div class="footer">Phố ẩm thực Vĩnh Khánh · TP.HCM</div>
</div>

<script type="module" src="./list.js"></script>
</body>
</html>
